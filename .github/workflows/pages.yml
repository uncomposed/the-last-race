name: Publish Pacing the Frontier
# Serves the single-file game at the repository's GitHub Pages address. Needs Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ['experiments/pacing-the-frontier/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp experiments/pacing-the-frontier/prototype.html _site/index.html
          cp experiments/pacing-the-frontier/spec.html _site/spec.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
