name: Publish Pacing the Frontier
# Serves the single-file game at the repository's GitHub Pages address. Needs Settings > Pages > Source: GitHub Actions.
# Each open pull request from a branch in this repository is also published at /preview/pr-<number>/, so it can be played on a phone
# before merging. This workflow always runs from main; it copies the branch's HTML file as a static file and never runs code from it.
# Pull requests from forks get no preview, so outside code is never hosted on the site. A closed pull request's preview goes at the next deploy.
on:
  push:
    branches: [main]
    paths: ['experiments/pacing-the-frontier/**', '.github/workflows/pages.yml']
  workflow_run:
    workflows: ['Pacing the Frontier checks']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Assemble the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site
          cp experiments/pacing-the-frontier/prototype.html _site/index.html
          cp experiments/pacing-the-frontier/spec.html _site/spec.html
          gh pr list --state open --base main --json number,headRefName,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | "\(.number) \(.headRefName)"' |
          while read -r num ref; do
            if git show "origin/$ref:experiments/pacing-the-frontier/prototype.html" > page.html 2>/dev/null; then
              mkdir -p "_site/preview/pr-$num"
              { echo '<meta name="robots" content="noindex">'; cat page.html; } > "_site/preview/pr-$num/index.html"
              echo "Preview for PR $num from $ref"
            fi
          done
          rm -f page.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
