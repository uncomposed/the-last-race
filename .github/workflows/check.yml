name: Engine and interface checks
on:
  push:
    paths: ['src/**', 'tests/**', 'scripts/**', 'compat/**', 'research/**', 'package.json', 'package-lock.json', 'tsconfig.json', '.github/workflows/check.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'scripts/**', 'compat/**', 'research/**', 'package.json', 'package-lock.json', 'tsconfig.json', '.github/workflows/check.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run check
      - run: npm run simulate
      - uses: actions/upload-artifact@v4
        with:
          name: numerical-and-policy-evidence
          path: artifacts/
